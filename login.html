<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Bot - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <h1>🔐 Report Bot</h1>
            
            <!-- Login Form -->
            <div id="loginForm">
                <h2>Sign In</h2>
                <input type="email" id="email" placeholder="Enter your email" required>
                <button onclick="login()">Send Verification Code</button>
                <p>Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" style="display:none;">
                <h2>Create Account</h2>
                <input type="text" id="signupName" placeholder="Full Name" required>
                <input type="tel" id="signupPhone" placeholder="Phone Number" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <button onclick="signup()">Sign Up</button>
                <p>Already have an account? <a href="#" onclick="showLogin()">Sign In</a></p>
            </div>

            <!-- Verification Form -->
            <div id="verifyForm" style="display:none;">
                <h2>Verify Your Email</h2>
                <p>A verification code was sent to your email</p>
                <input type="text" id="verifyCode" placeholder="Enter 6-digit code" maxlength="6">
                <button onclick="verify()">Verify</button>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        let currentUserId = null;

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
            document.getElementById('verifyForm').style.display = 'none';
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('verifyForm').style.display = 'none';
        }

        async function signup() {
            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, email })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentUserId = data.userId;
                    document.getElementById('signupForm').style.display = 'none';
                    document.getElementById('verifyForm').style.display = 'block';
                    showMessage('Verification code sent to your email', 'success');
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.requiresVerification) {
                    currentUserId = data.userId;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('verifyForm').style.display = 'block';
                    showMessage('Verification code sent to your email', 'success');
                } else if (data.success) {
                    // Save token and redirect to dashboard
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function verify() {
            const code = document.getElementById('verifyCode').value;

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, code })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
    </script>
</body>
</html>
